name: Собрать ленту каналов

# Зачем: облачный агент-разборщик не может открыть ни t.me, ни Railway —
# егресс работает как белый список. А raw.githubusercontent.com ему доступен.
# Поэтому ленту собираем здесь и кладём в репозиторий обычным файлом.

on:
  schedule:
    - cron: "0 */4 * * *"   # каждые 4 часа, время UTC
  workflow_dispatch:         # и по кнопке, когда нужно вручную

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Собрать посты
        run: python collector.py --once feed.txt
      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "market-signals bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.txt
          git diff --staged --quiet || git commit -m "Лента каналов: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
